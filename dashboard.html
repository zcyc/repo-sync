<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f2eee8">
  <title>repo-sync</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('repo-sync-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      color: #2b2926;
      background: #f2eee8;
      --bg: #f2eee8;
      --surface: #fffdf9;
      --surface-solid: #fffdf9;
      --surface-soft: #f7f2eb;
      --line: #e2dbd1;
      --line-strong: #cfc5b8;
      --text: #2b2926;
      --muted: #756f66;
      --primary: #b45f42;
      --primary-strong: #974b32;
      --primary-soft: #f6e5dc;
      --teal: #5e7c68;
      --danger: #ad4545;
      --shadow: 0 10px 30px rgba(75, 57, 42, .08);
      --shadow-sm: 0 5px 15px rgba(75, 57, 42, .08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem clamp(1rem, 3vw, 3.75rem) 5rem;
      background: var(--bg);
    }
    header, section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(1.1rem, 2vw, 1.7rem);
      margin-block: 1rem;
      box-shadow: var(--shadow);
    }
    header {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem clamp(1.1rem, 2vw, 1.7rem);
    }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: .22rem; font-size: clamp(1.65rem, 3vw, 2.15rem); letter-spacing: -.045em; }
    h2 { margin-bottom: .15rem; font-size: 1.05rem; letter-spacing: -.02em; }
    .brand { display: flex; align-items: center; gap: .85rem; min-width: 15rem; }
    .brand-mark {
      display: grid;
      flex: 0 0 3.15rem;
      place-items: center;
      width: 3.15rem;
      height: 3.15rem;
      border-radius: .75rem;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 7px 14px rgba(180, 95, 66, .2);
      font-size: 1.6rem;
      font-weight: 800;
    }
    .eyebrow { color: var(--primary); font-size: .68rem; font-weight: 800; letter-spacing: .1em; }
    .subtitle { margin: 0; color: var(--muted); font-size: .88rem; }
    .header-tools { display: grid; gap: .6rem; justify-items: end; }
    .header-meta { display: flex; gap: .4rem; align-items: center; color: var(--muted); font-size: .78rem; }
    .status-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 .25rem rgba(94, 124, 104, .14); }
    .controls, .actions { display: flex; gap: .55rem; align-items: end; flex-wrap: wrap; }
    .controls { justify-content: end; }
    label { display: grid; gap: .38rem; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .01em; }
    input, textarea, select, button { font: inherit; border: 1px solid var(--line-strong); border-radius: 10px; padding: .64rem .75rem; }
    input, textarea, select { width: 100%; color: var(--text); background: var(--surface-solid); transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease; }
    input::placeholder, textarea::placeholder { color: #9c9489; }
    input:hover, textarea:hover, select:hover { border-color: #b9ad9f; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(180, 95, 66, .14); outline: 0; }
    input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: var(--primary); }
    input[type="number"] { width: 8rem; }
    #task-form input[type="number"] { width: 100%; }
    #language-select { width: auto; min-width: 6.5rem; }
    input#username, input#password, input#password-confirm, input#task-filter { min-width: 16rem; width: auto; }
    textarea { min-height: 5rem; resize: vertical; }
    button { cursor: pointer; color: #fff; background: var(--primary); border-color: var(--primary); box-shadow: 0 5px 12px rgba(180, 95, 66, .16); font-weight: 700; transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease; }
    button:hover { background: var(--primary-strong); box-shadow: 0 8px 18px rgba(180, 95, 66, .2); transform: translateY(-1px); }
    button.secondary { color: var(--text); background: var(--surface-solid); border-color: var(--line-strong); box-shadow: none; }
    button.secondary:hover { border-color: #b9ad9f; background: var(--surface-soft); box-shadow: var(--shadow-sm); }
    button.danger { color: var(--danger); background: #fff4f1; border-color: #e8cbc0; box-shadow: none; }
    button.danger:hover { background: #fbe8df; }
    button:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    :focus-visible { outline: 3px solid #c77d61; outline-offset: 2px; }
    #message { min-height: 1.4rem; margin: 1rem .15rem; color: var(--muted); font-size: .82rem; }
    #message:not(:empty) { padding: .7rem .85rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .62); }
    .error { color: var(--danger) !important; border-color: #e9c6c1 !important; background: #fff4f1 !important; }
    .muted { color: var(--muted); }
    .panel-heading, .task-toolbar { display: flex; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
    .section-caption { margin: .28rem 0 0; color: var(--muted); font-size: .8rem; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-solid); -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; min-width: 1180px; table-layout: fixed; }
    col.task-id { width: 6%; }
    col.workspace { width: 14%; }
    col.source { width: 18%; }
    col.mode { width: 10%; }
    col.recent-run { width: 11%; }
    col.target { width: 5%; }
    col.queue { width: 12%; }
    col.updated { width: 6%; }
    col.task-actions { width: 18%; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: .9rem .7rem; vertical-align: top; overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--surface-soft); }
    th { color: var(--muted); background: var(--surface-soft); font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    th:first-child { border-radius: 13px 0 0 0; }
    th:last-child { border-radius: 0 13px 0 0; }
    code, textarea { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    td, td code { font-size: .8rem; line-height: 1.55; }
    td strong { font-size: .84rem; }
    td.task-id { white-space: nowrap; }
    td.task-id .pill { display: flex; width: max-content; margin-top: .4rem; }
    .cell-detail { display: block; margin-top: .2rem; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .repo-url, .workspace-path { display: block; overflow-wrap: anywhere; }
    .queue-count { font-weight: 700; }
    td.actions { min-width: 15rem; padding: .75rem; }
    .action-list { display: flex; gap: .45rem; flex-wrap: wrap; }
    .action-list button { flex: 1 1 0; min-width: 0; min-height: 2.25rem; padding: .45rem .5rem; font-size: .72rem; }
    .action-list button[data-action="run"] { flex-basis: 100%; }
    .pill { display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px; padding: .22rem .58rem; color: var(--primary-strong); background: var(--primary-soft); font-size: .72rem; font-weight: 800; }
    .pill::before { content: ""; width: .35rem; height: .35rem; border-radius: 50%; background: currentColor; }
    .pill.off { color: var(--muted); background: #eeeae4; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    .checks { display: flex; gap: .8rem 1.15rem; align-items: center; flex-wrap: wrap; padding: .2rem 0 .35rem; }
    .checks label { display: flex; align-items: center; gap: .4rem; color: var(--text); font-size: .8rem; font-weight: 600; }
    details { margin-top: 1.25rem; border-top: 1px solid var(--line); padding-top: .9rem; }
    summary { cursor: pointer; color: var(--text); font-size: .8rem; font-weight: 800; list-style-position: inside; }
    details[open] summary { margin-bottom: 1.1rem; }
    #task-form > .actions { margin-top: 1.5rem; }
    .auth-card { max-width: 54rem; margin-inline: auto; }
    .auth-card .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .auth-card .actions { justify-content: end; }
    @media (max-width: 900px) {
      header { align-items: stretch; flex-direction: column; }
      .header-tools, .controls { justify-items: stretch; justify-content: stretch; }
      .form-grid, .auth-card .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls label:first-child { flex: 1 1 15rem; }
    }
    @media (max-width: 620px) {
      body { padding: 1rem .75rem 3rem; }
      header, section { border-radius: 16px; padding: 1rem; }
      .brand { min-width: 0; }
      .brand-mark { flex-basis: 2.65rem; width: 2.65rem; height: 2.65rem; border-radius: .65rem; }
      .form-grid, .auth-card .form-grid { grid-template-columns: 1fr; }
      .wide, .full { grid-column: auto; }
      input#username, input#password, input#password-confirm, input#task-filter { min-width: 0; width: 100%; }
      .task-toolbar, .panel-heading { align-items: flex-start; flex-direction: column; }
      .task-toolbar .actions { width: 100%; }
      .task-toolbar .actions > * { flex: 1; }
      .auth-card .actions { justify-content: stretch; }
      .auth-card .actions button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      color: #f1ece5;
      background: #191715;
      --bg: #191715;
      --surface: #24211e;
      --surface-solid: #24211e;
      --surface-soft: #2c2824;
      --line: #413b35;
      --line-strong: #5a5047;
      --text: #f1ece5;
      --muted: #b8aca0;
      --primary: #d47c5b;
      --primary-strong: #e08b69;
      --primary-soft: #493027;
      --teal: #91b29a;
      --danger: #e08378;
      --shadow: 0 18px 44px rgba(0, 0, 0, .24);
      --shadow-sm: 0 7px 18px rgba(0, 0, 0, .2);
    }
    html[data-theme="dark"] input::placeholder, html[data-theme="dark"] textarea::placeholder { color: #887c71; }
    html[data-theme="dark"] button.secondary { background: var(--surface-solid); }
    html[data-theme="dark"] button.danger, html[data-theme="dark"] .error { background: #3a2522 !important; border-color: #74413a !important; }
    html[data-theme="dark"] .pill.off { background: #413b35; color: #b8aca0; }
    html[data-theme="dark"] #message:not(:empty) { background: var(--surface-solid); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">↔</div>
      <div>
        <span class="eyebrow" data-i18n="consoleEyebrow">同步控制台</span>
        <h1>repo-sync</h1>
        <p class="subtitle" data-i18n="appSubtitle">SQLite 任务、同步状态和 Webhook 队列</p>
      </div>
    </div>
    <div class="header-tools">
      <div class="header-meta"><span class="status-dot"></span><span data-i18n="serviceStatus">服务在线 · 每 5 秒自动更新</span></div>
      <div class="controls">
        <label for="task-filter"><span data-i18n="filterTask">筛选任务</span>
          <input id="task-filter" type="search" placeholder="ID、源仓库或 Workspace" data-i18n-placeholder="filterPlaceholder" autocomplete="off">
        </label>
        <label for="status-filter"><span data-i18n="status">状态</span>
          <select id="status-filter">
            <option value="all" data-i18n="all">全部</option>
            <option value="enabled" data-i18n="enabled">启用</option>
            <option value="disabled" data-i18n="disabled">停用</option>
            <option value="failed" data-i18n="failed">失败</option>
            <option value="queued" data-i18n="queued">有待处理事件</option>
          </select>
        </label>
        <label for="language-select"><span data-i18n="language">语言</span>
          <select id="language-select">
            <option value="zh" data-i18n="chinese">中文</option>
            <option value="en" data-i18n="english">English</option>
          </select>
        </label>
        <button id="theme-toggle" class="secondary" type="button" aria-pressed="false"></button>
        <button id="logout" class="secondary" type="button" hidden data-i18n="logout">退出登录</button>
      </div>
    </div>
  </header>

  <p id="message" role="status" aria-live="polite"></p>

  <section id="auth-panel" class="auth-card" hidden>
    <div class="panel-heading"><div><span class="eyebrow" data-i18n="authEyebrow">安全登录</span><h2 id="auth-title">登录</h2><p class="section-caption" data-i18n="authCaption">使用管理员账号进入同步控制台</p></div></div>
    <form id="auth-form" class="form-grid">
      <label for="username"><span data-i18n="account">账号</span>
        <input id="username" name="username" required maxlength="64" autocomplete="username">
      </label>
      <label for="password"><span data-i18n="password">密码</span>
        <input id="password" name="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password">
      </label>
      <label id="password-confirm-field" for="password-confirm"><span data-i18n="confirmPassword">确认密码</span>
        <input id="password-confirm" name="password-confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password">
      </label>
      <p class="actions full"><button id="auth-submit" type="submit" data-i18n="signIn">登录</button></p>
    </form>
  </section>

  <main id="app" hidden>
  <section>
    <div class="panel-heading"><div><span class="eyebrow" data-i18n="settingsEyebrow">账号设置</span><h2 data-i18n="accountSecurity">账号安全</h2><p class="section-caption" data-i18n="passwordCaption">定期更新凭据，保护任务配置和运行权限</p></div></div>
    <form id="password-form" class="form-grid">
      <label for="current-password"><span data-i18n="currentPassword">当前密码</span>
        <input id="current-password" name="current-password" type="password" required minlength="12" maxlength="256" autocomplete="current-password">
      </label>
      <label for="new-password"><span data-i18n="newPassword">新密码</span>
        <input id="new-password" name="new-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password">
      </label>
      <label for="new-password-confirm"><span data-i18n="confirmNewPassword">确认新密码</span>
        <input id="new-password-confirm" name="new-password-confirm" type="password" required minlength="12" maxlength="256" autocomplete="new-password">
      </label>
      <p class="actions full"><button type="submit" data-i18n="changePassword">修改密码</button></p>
    </form>
  </section>

  <section>
    <div class="task-toolbar">
      <div><span class="eyebrow" data-i18n="taskListEyebrow">任务列表</span><h2 data-i18n="syncTasks">同步任务</h2><p class="section-caption" data-i18n="taskCaption">管理仓库镜像、定时运行和 Webhook 队列</p></div>
      <div class="actions"><button id="new-task" type="button" data-i18n="newTask">新建任务</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <colgroup><col class="task-id"><col class="workspace"><col class="source"><col class="mode"><col class="recent-run"><col class="target"><col class="queue"><col class="updated"><col class="task-actions"></colgroup>
        <thead><tr><th data-i18n="idStatus">ID / 状态</th><th>Workspace</th><th data-i18n="sourceRepo">源仓库</th><th data-i18n="modeSchedule">模式 / 调度</th><th data-i18n="recentRun">最近运行</th><th data-i18n="target">目标</th><th data-i18n="webhookQueue">Webhook 队列</th><th data-i18n="lastConfig">最后配置</th><th data-i18n="actions">操作</th></tr></thead>
        <tbody id="tasks"><tr><td colspan="9" class="muted" data-i18n="loginToLoad">登录后加载任务</td></tr></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="panel-heading"><div><span class="eyebrow" data-i18n="taskConfigEyebrow">任务配置</span><h2 id="editor-title">新建同步任务</h2><p class="section-caption" data-i18n="saveCaption">保存后配置会立即生效</p></div></div>
    <form id="task-form">
      <input id="task-id" type="hidden">
      <div class="form-grid">
        <label class="wide"><span data-i18n="sourceUrl">源仓库 URL 或路径</span>
          <input id="source" required placeholder="https://example.com/org/repo.git" data-i18n-placeholder="sourcePlaceholder">
        </label>
        <label><span>Workspace</span>
          <input id="workspace" required placeholder="./repo-workspace" data-i18n-placeholder="workspacePlaceholder">
        </label>
        <label class="wide"><span data-i18n="targetRepo">目标仓库（每行一个）</span>
          <textarea id="target" required placeholder="https://example.com/org/mirror.git" data-i18n-placeholder="targetPlaceholder"></textarea>
        </label>
        <label><span data-i18n="mode">模式</span>
          <select id="mode"><option value="branch">branch</option><option value="mirror">mirror</option></select>
        </label>
        <label><span data-i18n="crontab">Crontab（可选）</span>
          <input id="crontab" placeholder="0/10 * * * * ? *" data-i18n-placeholder="crontabPlaceholder">
        </label>
        <label><span data-i18n="branches">分支（每行一个，空=全部）</span>
          <textarea id="branches" placeholder="main&#10;release/*" data-i18n-placeholder="branchesPlaceholder"></textarea>
        </label>
        <label><span data-i18n="includeRefs">包含 refs（每行一个）</span>
          <textarea id="include-refs" placeholder="refs/heads/*" data-i18n-placeholder="includeRefsPlaceholder"></textarea>
        </label>
        <label><span data-i18n="excludeRefs">排除 refs（每行一个）</span>
          <textarea id="exclude-refs" placeholder="refs/heads/tmp/*" data-i18n-placeholder="excludeRefsPlaceholder"></textarea>
        </label>
        <label><span data-i18n="timeout">超时（秒）</span>
          <input id="timeout-secs" type="number" min="1" value="300" required>
        </label>
      </div>
      <details>
        <summary data-i18n="advancedOptions">高级选项</summary>
        <div class="form-grid">
          <div class="full checks">
            <label><input id="enabled" type="checkbox" checked><span data-i18n="enableTask">启用任务</span></label>
            <label><input id="dry-run" type="checkbox"><span data-i18n="dryRun">Dry run</span></label>
            <label><input id="allow-destructive" type="checkbox"><span data-i18n="allowDestructive">允许破坏性操作</span></label>
            <label><input id="sync-lfs" type="checkbox"><span data-i18n="syncGitLfs">同步 Git LFS</span></label>
            <label><input id="prune-branches" type="checkbox"><span data-i18n="pruneBranches">清理目标分支</span></label>
            <label><input id="prune-tags" type="checkbox"><span data-i18n="pruneTags">清理目标标签</span></label>
            <label><input id="atomic" type="checkbox" checked><span data-i18n="atomicPush">Atomic push</span></label>
          </div>
          <label><span data-i18n="divergencePolicy">分支分叉策略</span>
            <select id="divergence"><option value="fail">fail</option><option value="keep">keep</option><option value="force">force</option></select>
          </label>
          <label><span data-i18n="tagPolicy">标签冲突策略</span>
            <select id="tag-policy"><option value="preserve">preserve</option><option value="fail">fail</option><option value="force">force</option></select>
          </label>
          <label><span data-i18n="maxRetries">额外重试次数</span>
            <input id="max-retries" type="number" min="0" max="10" value="3" required>
          </label>
          <label><span data-i18n="retryBackoff">重试初始间隔（秒）</span>
            <input id="retry-backoff-secs" type="number" min="0" value="5" required>
          </label>
          <label><span data-i18n="failureCooldown">失败冷却（秒）</span>
            <input id="failure-cooldown-secs" type="number" min="0" value="60" required>
          </label>
          <label><span data-i18n="webhookSecretEnv">Webhook secret 环境变量（每行一个）</span>
            <textarea id="webhook-secret-envs" placeholder="REPO_SYNC_WEBHOOK_SECRET_MAIN" data-i18n-placeholder="webhookSecretPlaceholder"></textarea>
          </label>
          <label><span data-i18n="maxPendingEvents">最大待处理事件数</span>
            <input id="webhook-max-pending-events" type="number" min="1" value="10000" required>
          </label>
          <label><span data-i18n="eventLease">事件租约（秒）</span>
            <input id="webhook-event-lease-secs" type="number" min="1" value="900" required>
          </label>
        </div>
      </details>
      <p class="actions"><button type="submit" data-i18n="saveTask">保存任务</button><button id="cancel" class="secondary" type="button" data-i18n="cancelEdit">取消编辑</button></p>
    </form>
  </section>
  </main>

  <script>
    const message = document.querySelector('#message');
    const authPanel = document.querySelector('#auth-panel');
    const authTitle = document.querySelector('#auth-title');
    const authForm = document.querySelector('#auth-form');
    const authSubmit = document.querySelector('#auth-submit');
    const passwordForm = document.querySelector('#password-form');
    const passwordSubmit = passwordForm.querySelector('button[type="submit"]');
    const passwordConfirmField = document.querySelector('#password-confirm-field');
    const logout = document.querySelector('#logout');
    const app = document.querySelector('#app');
    const tasks = document.querySelector('#tasks');
    const form = document.querySelector('#task-form');
    const editorTitle = document.querySelector('#editor-title');

        }
        setForm(); await load();
      } catch (error) { setMessage('actionFailed', { error: error.message }, 'error'); }
    });

    document.querySelector('#new-task').addEventListener('click', () => { setForm(); document.querySelector('#editor-title').scrollIntoView({ behavior: 'smooth' }); });
    document.querySelector('#cancel').addEventListener('click', () => setForm());
    taskFilter.addEventListener('input', render);
    statusFilter.addEventListener('change', render);
    languageSelect.addEventListener('change', () => {
      locale = languageSelect.value === 'en' ? 'en' : 'zh';
      writeSetting('repo-sync-language', locale);
      applyLocale();
      render();
    });
    themeToggle.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      writeSetting('repo-sync-theme', theme);
      updateThemeControl();
    });
    logout.addEventListener('click', async () => {
      try {
        await request('/api/auth/logout', { method: 'POST' });
        showAuth(true); setMessage('logoutSuccess');
      } catch (error) {
        setMessage('logoutFailed', { error: error.message }, 'error');
      }
    });
    applyLocale();
    setForm(); initAuth(); setInterval(() => { if (document.visibilityState === 'visible' && !app.hidden) load(); }, 5000);
  </script>
</body>
</html>
