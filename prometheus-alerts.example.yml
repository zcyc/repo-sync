groups:
  - name: repo-sync
    rules:
      - alert: RepoSyncWebhookQueueStalled
        expr: repo_sync_webhook_oldest_event_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: repo-sync webhook queue is stalled
          description: The oldest pending webhook event is older than 15 minutes.

      - alert: RepoSyncSyncFailures
        expr: increase(repo_sync_sync_runs_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: repo-sync sync failed
          description: At least one synchronization failed during the last 15 minutes.

      - alert: RepoSyncDeadWebhookEvents
        expr: repo_sync_webhook_events{status="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: repo-sync has dead webhook events
          description: A webhook event exhausted its retry budget and needs operator action.

      - alert: RepoSyncLoginRateLimited
        expr: increase(repo_sync_auth_rate_limited_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: repo-sync login attempts are being rate limited
          description: Review exposure and reverse-proxy access logs for authentication abuse.
