[package]
name = "repo-sync"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.0.14", features = ["derive"] }
base64 = "0.22.1"
ctrlc = "3.4.7"
hmac = "0.12.1"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "1.1.0"
job_scheduler_ng = "2.0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
signal-hook = "0.3.18"

[profile.release]
lto = true
strip = true
